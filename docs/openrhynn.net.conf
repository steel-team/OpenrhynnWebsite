server {
  listen 80;
  listen [::]:80;

  # access_log off;
  access_log /var/log/nginx/openrhynn.net.log;
  error_log /var/log/nginx/openrhynn.net-error.log;

  server_name openrhynn.net www.openrhynn.net;

  location / {
    proxy_pass http://127.0.0.1:3000;
	  #proxy_pass http://unix:/tmp/landing.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /webapp/ {
    alias /var/www/OpenRhynnRunner/;
    include mime.types;
    autoindex off;
    expires off;
    add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://openrhynn.net";
    try_files $uri $uri/ =404;
  }
}
